stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy
  - package
  - package-test

build-job-ubuntu:
  stage: build
  before_script:
    - g++ --version
    - ls googletest/
    - rm -rf googletest/
    - git clone https://github.com/google/googletest.git 
    - cd googletest
    - mkdir build 
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all
    - mv basic_test basic_test_ubuntu
  tags:
    - ubuntu
  artifacts:
    paths:
      - basic_test_ubuntu

build-job-centos:
  stage: build
  before_script:
    - g++ --version
    - ls googletest/
    # on CentOS submodule is copied with original repository
    # - git clone https://github.com/google/googletest.git 
    - cd googletest
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all
    - mv basic_test basic_test_centos
  tags:
    - centos
  artifacts:
    paths:
      - basic_test_centos






test-job-ubuntu:
  stage: test
  script:
    - ./basic_test
  tags:
    - ubuntu

test-job-centos:
  stage: test
  script:
    - ./basic_test
  tags:
    - centos