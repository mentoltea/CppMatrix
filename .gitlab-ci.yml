stages:
  - build # build googletests & tests, artifact tests (why dont run?)
  - test # run tests
  - deploy
  - package
  - package-test

build-job-ubuntu:
  stage: build
  before_script:
    - g++ --version
    - ls googletest/
    # on ubuntu submodule is NOT copied for some reason
    # so we need to clone it manually
    - rm -rf googletest/
    - git clone -b v1.15.x https://github.com/google/googletest.git 
    - cd googletest
    - mkdir build 
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all CFLAGS=--std=c++14
    - mv basic_test basic_test_ubuntu
    - mv calculation_test calculation_test_ubuntu
  tags:
    - ubuntu
  artifacts:
    paths:
      - basic_test_ubuntu
      - calculation_test_ubuntu

build-job-centos:
  stage: build
  before_script:
    - g++ --version
    - ls googletest/
    # on CentOS submodule is copied with original repository
    # - git clone https://github.com/google/googletest.git 
    - cd googletest
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all
    - mv basic_test basic_test_centos
    - mv calculation_test calculation_test_centos
  tags:
    - centos
  artifacts:
    paths:
      - basic_test_centos
      - calculation_test_centos






test-job-ubuntu:
  stage: test
  script:
    - .\basic_test_ubuntu
    - .\calculation_test_ubuntu
  tags:
    - ubuntu

test-job-centos:
  stage: test
  script:
    - .\basic_test_centos
    - .\calculation_test_centos
  tags:
    - centos