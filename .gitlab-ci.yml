stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy
  - package
  - package-test

build-job:
  stage: build
  script:
    - mkdir bin
    - g++ .\test\basic-test.cpp -I./gtest/include -L./gtest/lib -lgtest -o basic_test
  tags:
    - ubuntu
    - centos
  artifacts:
    paths:
      - basic_test

test-job:
  stage: test
  script:
    - ./basic_test
  tags:
    - ubuntu
    - centos