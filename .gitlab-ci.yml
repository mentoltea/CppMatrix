stages:
  - build # build googletests & tests, artifact tests (why dont run?)
  - test # run tests
  - package
  - package-test
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: none
  GIT_SUBMODULE_DEPTH: 1

#
# BUILD
#
build-job-ubuntu:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - g++ --version
    - sudo apt update && sudo apt upgrade
    - sudo apt install gcc
    - g++ --version
    - ls googletest/
    # on ubuntu submodule is NOT copied for some reason
    # so we need to clone it manually
    #
    # on ubuntu g++ is lower c++17 so we need to fetch old version of googletest
    - rm -rf googletest/
    - git clone -b v1.15.x https://github.com/google/googletest.git 
    - cd googletest
    # - git checkout v1.15.x 
    - mkdir build 
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all CFLAGS=--std=c++17
    - mv basic_test basic_test_ubuntu
    - mv calculation_test calculation_test_ubuntu
    # - mv libmatrix.a libmatrix_ubuntu.a
  tags:
    - ubuntu
  artifacts:
    paths:
      - basic_test_ubuntu
      - calculation_test_ubuntu

build-job-centos:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  before_script:
    - g++ --version
    - ls googletest/
    # on CentOS submodule is copied with original repository
    # - git clone https://github.com/google/googletest.git 
    - cd googletest
    - mkdir build
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all
    - mv basic_test basic_test_centos
    - mv calculation_test calculation_test_centos
    # - mv libmatrix.a libmatrix_ubuntu.a
  tags:
    - centos
  artifacts:
    paths:
      - basic_test_centos
      - calculation_test_centos


#
# TEST
#
test-job-ubuntu:
  stage: test
  # dependencies: [build-job-ubuntu] 
  needs: 
    - job: build-job-ubuntu
      artifacts: true
  script:
    - ls
    - valgrind ./basic_test_ubuntu
    - valgrind ./calculation_test_ubuntu
  tags:
    - ubuntu

test-job-centos:
  stage: test
  # dependencies: [build-job-centos]
  needs: 
    - job: build-job-centos
      artifacts: true 
  script:
    - ls
    - valgrind ./basic_test_centos
    - valgrind ./calculation_test_centos
  tags:
    - centos


#
# PACKAGE
#

package-job-ubuntu:
  stage: package
  needs:
    - job: test-job-ubuntu
      artifacts: false
  script:
    - ls -R
    - sudo apt-get install dpkg debconf debhelper lintian
    - mkdir deb-package
    - mkdir -p deb-package/DEBIAN
    - mkdir -p deb-package/usr/bin
    - mkdir -p deb-package/usr/include
    - cp ./src/matrix.hpp deb-package/usr/include
    - mv deb-manifest deb-package/DEBIAN/control
    - dpkg-deb --build ./deb-package
    - ls -R
  tags:
    - ubuntu
  artifacts:
    paths:
      - deb-package.deb

package-job-centos:
  stage: package
  needs:
    - job: test-job-centos
      artifacts: false
  script:
    - ls -R

  tags:
    - centos

#
# PACKAGE-TEST
#

package-test-job-ubuntu:
  stage: package-test
  needs:
    - job: package-job-ubuntu
      artifacts: true
  script:
    - ls -R
  tags:
    - ubuntu

package-test-job-centos:
  stage: package-test
  needs:
    - job: package-job-ubuntu
      artifacts: true
  script:
    - ls -R
  tags:
    - centos


#
# DEPLOY
#
deploy-documentation-job:
  stage: deploy
  dependencies: []
  before_script:
    - ls
    - apt-get -y install doxygen
  script: 
    - doxygen
    - ls
    - ls doxygen
  artifacts:
    name: "Documentation $CI_COMMIT_REF_SLUG/$CI_COMMIT_SHORT_SHA"
    paths:
      - "doxygen/**"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "gitlab-ci-test"
    - if: $CI_COMMIT_TAG
  tags:
    - ubuntu

deploy-prod-job:
  stage: deploy
  needs: 
    - job: deploy-documentation-job
      artifacts: true
    - job: package-job-centos
      artifacts: true
    - job: package-job-ubuntu
      artifacts: true
    
  script: 
    - ls -R
  artifacts:
    name: "Release $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - "doxygen/**"

  tags:
    - ubuntu