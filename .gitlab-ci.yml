stages:
  - build # build googletests & tests, artifact tests (why dont run?)
  - test # run tests
  - deploy
  - package
  - package-test

variables:
  GIT_SUBMODULE_STRATEGY: recursive

#
# BUILD
#
build-job-ubuntu:
  stage: build
  before_script:
    - g++ --version
    - sudo apt update && sudo apt upgrade
    - sudo apt install gcc
    - g++ --version
    - ls googletest/
    # on ubuntu submodule is NOT copied for some reason
    # so we need to clone it manually
    # - rm -rf googletest/
    # - git clone -b v1.15.x https://github.com/google/googletest.git 
    - cd googletest
    - git checkout v1.15.x 
    - mkdir build 
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all CFLAGS=--std=c++17
    - mv basic_test basic_test_ubuntu
    - mv calculation_test calculation_test_ubuntu
  tags:
    - ubuntu
  artifacts:
    paths:
      - basic_test_ubuntu
      - calculation_test_ubuntu

build-job-centos:
  stage: build
  before_script:
    - g++ --version
    - ls googletest/
    # on CentOS submodule is copied with original repository
    # - git clone https://github.com/google/googletest.git 
    - cd googletest
    - mkdir build
    - cd build
    - cmake ..
    - cmake --build . -j8
    - mv lib ../../gtest/lib
    - cd ../..
  script:
    - make all
    - mv basic_test basic_test_centos
    - mv calculation_test calculation_test_centos
  tags:
    - centos
  artifacts:
    paths:
      - basic_test_centos
      - calculation_test_centos



#
# TEST
#
test-job-ubuntu:
  stage: test
  script:
    - ls
    - ./basic_test_ubuntu
    - ./calculation_test_ubuntu
  tags:
    - ubuntu

test-job-centos:
  stage: test
  script:
    - ls
    - ./basic_test_centos
    - ./calculation_test_centos
  tags:
    - centos


#
# DEPLOY
#
deploy-documentation-job:
  stage: deploy
  dependencies: []
  before_script:
    - ls
    - apt-get -y install doxygen
  script: 
    - doxygen
    - ls
    - ls doxygen
  artifacts:
    paths:
      - "doxygen/**"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - ubuntu

deploy-prod-job:
  stage: deploy
  dependencies: [deploy-documentation-job]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    - ls
    # - apt-get -y install curl
    # - curl --location --output /usr/local/bin/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    # - sudo chmod +x /usr/local/bin/release-cli
    - release-cli -v
    # - apt-get -y install doxygen
  script: 
    - rm -rf gtest googletest test matrices Makefile
    - ls
    - ls doxygen
    - echo "Deploying..."
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  tags:
    - ubuntu
  release:
    name: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: '$CI_COMMIT_MESSAGE'